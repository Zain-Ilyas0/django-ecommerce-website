{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ product.name }}</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
</head>

<body>

    {% include 'navbar.html' %}


    <div class="product-detail-container">

        <!-- Product Image -->

        <div class="product-detail-image">

            <img src="{% static product.image %}"
                 alt="{{ product.name }}">

        </div>


        <!-- Product Information -->

        <div class="product-detail-info">

            <div class="product-category">
                {{ product.category }}
            </div>

            <h1>{{ product.name }}</h1>

            <div class="product-detail-price">
                Rs. {{ product.price }}
            </div>


            <div class="product-description">

                <h3>Description</h3>

                <p>
                    {{ product.description }}
                </p>

            </div>


            <!-- Buy Now -->

            <form action="{% url 'buy_now' product.id %}"
                  method="post">

                {% csrf_token %}

                <button type="submit"
                        class="detail-buy-btn">

                    Buy Now

                </button>

            </form>


            <!-- Add To Cart -->

            <form class="add-to-cart-form"
                  data-url="{% url 'add_to_cart' product.id %}"
                  method="post">

                {% csrf_token %}

                <button type="submit"
                        class="detail-cart-btn">

                    Add to Cart

                </button>

            </form>

        </div>

    </div>


</body>
</html>
